<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kings Tracker — Générateur de rapport</title>
<style>
  :root{--bg:#14161a;--pan:#1e2228;--acc:#f5c542;--txt:#e8e8e8}
  *{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:20px}
  h1{font-size:20px}.muted{color:#9aa3ad;font-size:13px}
  .panel{background:var(--pan);border-radius:10px;padding:14px;margin-bottom:14px}
  label{font-size:13px;margin-right:10px;display:inline-flex;align-items:center;gap:6px}
  input[type=number]{width:64px;background:#121417;color:var(--txt);border:1px solid #333;border-radius:6px;padding:4px}
  button{background:var(--acc);border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
  button.sec{background:#2a2f37;color:var(--txt)}
  canvas{width:100%;border-radius:8px;background:#000}
  #prog{height:6px;background:#2a2f37;border-radius:3px;margin-top:10px;display:none}
  #prog>div{height:100%;width:0;background:var(--acc);border-radius:3px}
  pre{background:#0d0f12;border:1px solid #2a2f37;border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<h1>👑 Kings Tracker — rapport de tracking</h1>
<p class="muted">100 % local : aucune vidéo n'est envoyée. Copiez le rapport généré et collez‑le dans le chat.</p>

<div class="panel">
  <div class="row">
    <input type="file" id="fileVideo" accept="video/*">
    <label>fps <input type="number" id="fps" value="30"></label>
    <button id="btnRun" disabled>▶ Analyser</button>
  </div>
  <div class="row" style="margin-top:10px">
    <label>H° min <input id="h0" type="number" value="25"></label>
    <label>H° max <input id="h1" type="number" value="70"></label>
    <label>S min <input id="smin" type="number" step="0.05" value="0.5"></label>
    <label>V min <input id="vmin" type="number" step="0.05" value="0.6"></label>
    <label>aire min <input id="amin" type="number" value="80"></label>
  </div>
  <div id="prog"><div></div></div>
</div>

<div class="panel"><canvas id="view"></canvas></div>

<div class="panel">
  <div class="row"><b>Comparateur de similitude (2 crops)</b>
    <input type="file" id="simA" accept="image/*"><input type="file" id="simB" accept="image/*">
    <button class="sec" id="btnSim">Comparer</button>
  </div>
  <div id="simOut" class="muted"></div>
</div>

<div class="panel">
  <div class="row"><b>Rapport</b><button id="btnCopy">📋 Copier le rapport</button></div>
  <pre id="pre">— Lancez une analyse pour générer le rapport —</pre>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s), clamp=v=>Math.max(-2500,Math.min(2500,v));
const vid=document.createElement("video"); vid.muted=true;
const can=$("#view"), ctx=can.getContext("2d",{willReadFrequently:true});
let meta=null, R=null, simLast=null, running=false;

$("#fileVideo").onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  vid.src=URL.createObjectURL(f);
  vid.onloadeddata=()=>{ meta={name:f.name,w:vid.videoWidth,h:vid.videoHeight,dur:vid.duration};
    can.width=320; can.height=Math.round(320*meta.h/meta.w);
    ctx.font="12px monospace"; ctx.drawImage(vid,0,0,can.width,can.height);
    $("#btnRun").disabled=false; };
};
function seek(t){return new Promise(res=>{
  if(Math.abs(vid.currentTime-t)<1e-4)return res();
  const h=()=>{vid.removeEventListener("seeked",h);res();};
  vid.addEventListener("seeked",h); vid.currentTime=t;});}

function detect(S,K){
  const img=ctx.getImageData(0,0,can.width,can.height), d=img.data, w=can.width, h=can.height;
  const mask=new Uint8Array(w*h);
  for(let i=0;i<w*h;i++){
    const r=d[i*4]/255,g=d[i*4+1]/255,b=d[i*4+2]/255;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b),df=mx-mn; let hh=0;
    if(df>0){ if(mx===r)hh=((g-b)/df)%6; else if(mx===g)hh=(b-r)/df+2; else hh=(r-g)/df+4; hh*=60; if(hh<0)hh+=360; }
    if(hh>=S.h0&&hh<=S.h1&&(mx>0?df/mx:0)>=S.smin&&mx>=S.vmin)mask[i]=1;
  }
  const lab=new Int32Array(w*h), parent=[0]; let next=1;
  const find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;};
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x; if(!mask[i])continue;
    const l=x>0?lab[i-1]:0, u=y>0?lab[i-w]:0;
    if(l&&u){const fl=find(l),fu=find(u);lab[i]=Math.min(fl,fu);if(fl!==fu)parent[Math.max(fl,fu)]=Math.min(fl,fu);}
    else if(l||u)lab[i]=l||u;
    else{parent[next]=next;lab[i]=next;next++;}
  }
  const agg=new Map();
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const li=lab[y*w+x]; if(!li)continue; const rt=find(li);
    const a=agg.get(rt)||{n:0,x0:x,x1:x,y0:y,y1:y};
    a.n++; a.x0=Math.min(a.x0,x); a.x1=Math.max(a.x1,x); a.y0=Math.min(a.y0,y); a.y1=Math.max(a.y1,y); agg.set(rt,a);
  }
  const dets=[]; let merges=0;
  for(const c of agg.values()){
    if(c.n<S.amin)continue;
    const bw=c.x1-c.x0+1, bh=c.y1-c.y0+1;
    if(bw>2.2*bh){merges++; dets.push({x:(c.x0+bw*.25)*K,y:(c.y0+bh/2)*K,s:bh*K},{x:(c.x0+bw*.75)*K,y:(c.y0+bh/2)*K,s:bh*K});}
    else dets.push({x:(c.x0+bw/2)*K,y:(c.y0+bh/2)*K,s:bh*K});
  }
  return{dets,merges};
}

class Tracker{
  constructor(fps){this.fps=fps;this.dt=1/fps;this.tracks=new Map();this.nid=0;this.frame=0;this.mergeFrames=[];this.closeFrames=[];}
  spawn(d){this.tracks.set(this.nid++,{x:d.x,y:d.y,s:d.s,vx:0,vy:0,lost:0,first:this.frame,last:this.frame,
    occ:[],bands:[0,0,0,0,0],vmax:0,vsum:0,vn:0,sMin:d.s,sMax:d.s});}
  update(dets,merges){
    this.frame++; if(merges)this.mergeFrames.push(this.frame);
    const dt=this.dt;
    for(const t of this.tracks.values()){t.px=t.x+t.vx*dt;t.py=t.y+t.vy*dt;}
    if(!this.tracks.size)dets.slice().sort((a,b)=>a.x-b.x).forEach(d=>this.spawn(d));
    else{
      const ids=[...this.tracks.keys()],pairs=[];
      ids.forEach((id,a)=>dets.forEach((d,b)=>{const t=this.tracks.get(id);
        pairs.push([Math.hypot(t.px-d.x,t.py-d.y)+.5*Math.abs(t.s-d.s),a,b]);}));
      pairs.sort((p,q)=>p[0]-q[0]);
      const uD=new Set(),matched=new Set();
      for(const[c,a,b]of pairs){
        const id=ids[a]; if(matched.has(id)||uD.has(b))continue;
        const t=this.tracks.get(id),sp=Math.hypot(t.vx,t.vy);
        if(c<1.3*Math.max(100*dt,sp*dt)+5){
          uD.add(b);matched.add(id);
          const d=dets[b],k=Math.max(1,this.frame-t.last);
          t.vx=clamp(.5*t.vx+.5*(d.x-t.x)/(k*dt)); t.vy=clamp(.5*t.vy+.5*(d.y-t.y)/(k*dt));
          t.x=d.x;t.y=d.y;t.s=d.s;t.sMin=Math.min(t.sMin,d.s);t.sMax=Math.max(t.sMax,d.s);
          t.last=this.frame;t.lost=0;
        }
      }
      dets.forEach((d,b)=>{if(!uD.has(b))this.spawn(d);});
      for(const id of ids){const t=this.tracks.get(id);
        if(matched.has(id))t.lost=0;
        else{t.lost++;t.occ.push(this.frame);if(t.lost>15)this.tracks.delete(id);}}
    }
    for(const t of this.tracks.values()){
      if(t.lost)continue;
      const sp=Math.hypot(t.vx,t.vy);
      t.vmax=Math.max(t.vmax,sp);t.vsum+=sp;t.vn++;
      t.bands[sp<100?0:sp<500?1:sp<700?2:sp<=1500?3:4]++;
    }
    const act=[...this.tracks.values()].filter(t=>!t.lost);
    outer:for(let i=0;i<act.length;i++)for(let j=i+1;j<act.length;j++)
      if(Math.hypot(act[i].x-act[j].x,act[i].y-act[j].y)<1.1*(act[i].s+act[j].s)){this.closeFrames.push(this.frame);break outer;}
  }
}
const ranges=fr=>{const o=[];let s=null,p=null;
  for(const f of fr){if(s===null){s=p=f;}else if(f===p+1)p=f;else{o.push(s===p?""+s:s+"-"+p);s=p=f;}}
  if(s!==null)o.push(s===p?""+s:s+"-"+p);return o.join(", ");};

$("#btnRun").onclick=async()=>{
  if(running)return; running=true; $("#btnRun").disabled=true; $("#prog").style.display="block";
  const fps=+$("#fps").value||30;
  const S={h0:+$("#h0").value,h1:+$("#h1").value,smin:+$("#smin").value,vmin:+$("#vmin").value,amin:+$("#amin").value};
  const K=meta.w/can.width;
  R={fps,K,S,frames:0,anom:[],tr:new Tracker(fps)};
  vid.pause();
  const total=Math.floor(meta.dur*fps);
  for(let i=0;i<=total;i++){
    await seek(Math.min(i/fps,meta.dur-.001));
    ctx.drawImage(vid,0,0,can.width,can.height);
    const{dets,merges}=detect(S,K);
    R.tr.update(dets,merges); R.frames++;
    if(dets.length!==3)R.anom.push(R.frames);
    for(const[id,t]of R.tr.tracks){
      ctx.fillStyle=t.lost?"#f66":"#4f8";
      ctx.beginPath();ctx.arc(t.x/K,t.y/K,4,0,7);ctx.fill();
      ctx.fillText("#"+id,t.x/K+6,t.y/K-6);
    }
    $("#prog>div").style.width=(100*i/total)+"%";
    if(i%10===0)await new Promise(r=>setTimeout(r,0));
  }
  buildReport(); running=false; $("#btnRun").disabled=false;
};

function buildReport(){
  const t=R.tr, vm=Math.max(0,...[...t.tracks.values()].map(x=>x.vmax));
  const L=["=== RAPPORT TRACKING v1 ===","Généré le "+new Date().toLocaleString(),
   "Fichier: "+meta.name+" | "+meta.w+"x"+meta.h+" | durée "+meta.dur.toFixed(2)+" s",
   "fps analysé: "+R.fps+" | frames: "+R.frames,
   "Params: H "+R.S.h0+"-"+R.S.h1+"°, S>="+R.S.smin+", V>="+R.S.vmin+", aireMin="+R.S.amin+", gate=adaptatif","",
   "--- PISTES ("+t.nid+") ---"];
  for(const[id,x]of t.tracks){
    const pc=x.bands.map(b=>Math.round(100*b/Math.max(1,x.vn)));
    L.push("#"+id+": vie "+(x.last-x.first+1)+" f (f"+x.first+"-f"+x.last+") | v_moy "+Math.round(x.vsum/Math.max(1,x.vn))
      +" px/s | v_max "+Math.round(x.vmax)+" px/s | régimes <100:"+pc[0]+"% 100-500:"+pc[1]+"% 500-700:"+pc[2]
      +"% 700-1500:"+pc[3]+"% >1500:"+pc[4]+"% | couronne h "+Math.round(x.sMin)+"-"+Math.round(x.sMax)+" px");
  }
  L.push("","--- ÉVÉNEMENTS ---",
   "fusions de couronnes: "+t.mergeFrames.length+" f → "+(ranges(t.mergeFrames)||"-"),
   "proximités/risque de swap: "+(ranges(t.closeFrames)||"-"),
   "occlusions: "+[...t.tracks].map(([id,x])=>"#"+id+": "+(ranges(x.occ)||"ok")).join(" | "),
   "frames avec nb détections ≠ 3: "+(ranges(R.anom)||"-"),
   "","--- RÉGLAGES SUGGÉRÉS ---",
   "v_max mesurée "+Math.round(vm)+" px/s → gate max ≈ "+Math.round(1.3*Math.max(100,vm)/R.fps+5)+" px à "+R.fps+" fps");
  if(simLast)L.push("","--- SIMILITUDE (crops) ---","hist "+simLast.hist+"% | pixels "+simLast.pix+"% → "+simLast.verdict);
  $("#pre").textContent=L.join("\n");
}

const loadImg=f=>new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.src=URL.createObjectURL(f);});
$("#btnSim").onclick=async()=>{
  const a=$("#simA").files[0],b=$("#simB").files[0]; if(!a||!b)return;
  const ia=await loadImg(a),ib=await loadImg(b);
  const c=document.createElement("canvas");c.width=c.height=64;
  const x=c.getContext("2d",{willReadFrequently:true});
  const g=im=>{x.clearRect(0,0,64,64);const k=Math.max(64/im.width,64/im.height),w=im.width*k,h=im.height*k;
    x.drawImage(im,(64-w)/2,(64-h)/2,w,h);return x.getImageData(0,0,64,64).data;};
  const A=g(ia),B=g(ib),h1=new Array(24).fill(0),h2=new Array(24).fill(0); let mad=0;
  for(let i=0;i<4096;i++){
    for(let ch=0;ch<3;ch++){h1[ch*8+Math.min(7,A[i*4+ch]>>5)]++;h2[ch*8+Math.min(7,B[i*4+ch]>>5)]++;}
    mad+=Math.abs((A[i*4]+A[i*4+1]+A[i*4+2])-(B[i*4]+B[i*4+1]+B[i*4+2]))/3;
  }
  mad/=4096; let inter=0; for(let i=0;i<24;i++)inter+=Math.min(h1[i],h2[i]);
  simLast={hist:Math.round(100*inter/4096),pix:Math.round(100*(1-mad/255))};
  simLast.verdict=simLast.hist>90&&simLast.pix>90?"clones quasi identiques":simLast.hist>75?"très similaires":"différents";
  $("#simOut").textContent="Similarité: hist "+simLast.hist+"% | pixels "+simLast.pix+"% → "+simLast.verdict;
};
$("#btnCopy").onclick=()=>navigator.clipboard.writeText($("#pre").textContent).then(()=>{
  $("#btnCopy").textContent="✅ Copié !"; setTimeout(()=>$("#btnCopy").textContent="📋 Copier le rapport",1500);});
</script>
</body>
</html>
